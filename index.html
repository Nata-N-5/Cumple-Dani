<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<title>My first three.js app</title>
		<style>
			body { margin: 0; overflow: hidden; font-family: Georgia, 'Times New Roman', serif; background: #000; }

			/* ---------- INTRO MISTERIOSO ---------- */
			#intro {
				position: fixed;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				background: radial-gradient(circle at center, rgba(10, 6, 26, 0.55), rgba(0, 0, 0, 0.9));
				z-index: 15;
				pointer-events: none;
				opacity: 0;
				transition: opacity 1.4s ease;
			}

			#intro.visible { opacity: 1; }

			#intro h1 {
				margin: 0;
				color: #efe4ff;
				font-size: clamp(28px, 7vw, 76px);
				font-weight: normal;
				letter-spacing: 0.5em;
				text-indent: 0.5em;
				text-shadow: 0 0 20px rgba(190, 160, 255, 0.7), 0 0 60px rgba(120, 90, 220, 0.5);
				transform: scale(1.15);
				filter: blur(6px);
				opacity: 0;
				transition: transform 2.4s cubic-bezier(0.16, 1, 0.3, 1), filter 2s ease, opacity 2s ease;
			}

			#intro.visible h1 {
				transform: scale(1);
				filter: blur(0);
				opacity: 1;
			}

			/* ---------- OVERLAY DE LA CARTA ---------- */
			#carta-overlay {
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 24px;
				background: radial-gradient(circle at center, rgba(20, 14, 40, 0.75), rgba(0, 0, 0, 0.92));
				backdrop-filter: blur(6px);
				z-index: 10;
				cursor: pointer;
				opacity: 0;
				visibility: hidden;
				transition: opacity 0.45s ease, visibility 0.45s;
			}

			#carta-overlay.visible {
				opacity: 1;
				visibility: visible;
			}

			#carta-overlay img {
				max-width: 80vw;
				max-height: 72vh;
				border-radius: 6px;
				box-shadow: 0 0 60px rgba(255, 226, 160, 0.45), 0 20px 60px rgba(0, 0, 0, 0.6);
				transform: scale(0.85) rotate(-2deg);
				opacity: 0;
				transition: transform 0.55s cubic-bezier(0.2, 1.1, 0.3, 1), opacity 0.55s ease;
			}

			#carta-overlay.visible img {
				transform: scale(1) rotate(0deg);
				opacity: 1;
			}

			#carta-overlay p {
				margin: 0;
				color: #f3e6c8;
				letter-spacing: 0.22em;
				text-transform: uppercase;
				font-size: 14px;
				opacity: 0;
				transition: opacity 0.5s ease 0.35s;
				animation: parpadeo 2.4s ease-in-out infinite;
			}

			#carta-overlay.visible p { opacity: 0.85; }

			@keyframes parpadeo {
				0%, 100% { text-shadow: 0 0 10px rgba(255, 226, 160, 0.2); }
				50% { text-shadow: 0 0 18px rgba(255, 226, 160, 0.8); }
			}

			/* ---------- CONFETI ---------- */
			#confeti {
				position: fixed;
				inset: 0;
				width: 100%;
				height: 100%;
				z-index: 20;
				pointer-events: none;
			}

			/* ---------- AVISO DE SONIDO ---------- */
			#aviso-sonido {
				position: fixed;
				left: 50%;
				bottom: 28px;
				transform: translateX(-50%);
				z-index: 25;
				color: #d9cff0;
				font-size: 12px;
				letter-spacing: 0.2em;
				text-transform: uppercase;
				opacity: 0;
				pointer-events: none;
				transition: opacity 0.6s ease;
				animation: parpadeo 2.4s ease-in-out infinite;
			}

			#aviso-sonido.visible { opacity: 0.7; }

			/* ---------- TRANSICIÓN A LA SEGUNDA ESCENA ---------- */
			#glitch {
				position: fixed;
				inset: 0;
				width: 100%;
				height: 100%;
				z-index: 28;
				pointer-events: none;
				opacity: 0;
			}

			#glitch.visible { opacity: 1; }

			#fundido {
				position: fixed;
				inset: 0;
				background: #000;
				z-index: 30;
				pointer-events: none;
				opacity: 0;
				transition: opacity 1.2s ease;
			}

			#fundido.visible { opacity: 1; }

			/* ---------- BOTONES DE ESCENA ---------- */
			#entrar, #soplar {
				position: fixed;
				left: 50%;
				bottom: 8vh;
				transform: translateX(-50%) translateY(20px);
				z-index: 35;
				padding: 16px 54px;
				border: 2px solid #e8c25a;
				border-radius: 4px;
				background: linear-gradient(180deg, #b81d28, #7a0e16);
				color: #ffe9b0;
				font-family: Georgia, 'Times New Roman', serif;
				font-size: 18px;
				letter-spacing: 0.34em;
				text-indent: 0.34em;
				text-transform: uppercase;
				cursor: pointer;
				opacity: 0;
				visibility: hidden;
				box-shadow: 0 0 26px rgba(232, 194, 90, 0.35), inset 0 0 20px rgba(0, 0, 0, 0.45);
				transition: opacity 0.8s ease, visibility 0.8s, transform 0.8s cubic-bezier(0.2, 1.1, 0.3, 1),
				            box-shadow 0.3s ease;
			}

			#entrar.visible, #soplar.visible {
				opacity: 1;
				visibility: visible;
				transform: translateX(-50%) translateY(0);
			}

			#entrar:hover, #soplar:hover {
				box-shadow: 0 0 44px rgba(232, 194, 90, 0.75), inset 0 0 20px rgba(0, 0, 0, 0.3);
			}

			/* ---------- CONFETI DE LA ESCENA 1 ---------- */
			#confeti2 {
				position: fixed;
				inset: 0;
				width: 100%;
				height: 100%;
				z-index: 20;
				pointer-events: none;
			}

			/* ---------- LETRERO DE FELIZ CUMPLEAÑOS ---------- */
			#letrero {
				position: fixed;
				top: 7vh;
				left: 50%;
				z-index: 36;
				width: min(74vw, 860px);
				pointer-events: none;
				opacity: 0;
				transform: translateX(-50%) scale(0.6) rotate(-3deg);
				transition: opacity 1s ease, transform 1.1s cubic-bezier(0.2, 1.3, 0.3, 1);
				filter: drop-shadow(0 0 26px rgba(255, 210, 120, 0.65))
				        drop-shadow(0 14px 30px rgba(0, 0, 0, 0.55));
			}

			#letrero.visible {
				opacity: 1;
				transform: translateX(-50%) scale(1) rotate(0deg);
				animation: balanceo 4s ease-in-out 1.1s infinite;
			}

			@keyframes balanceo {
				0%, 100% { transform: translateX(-50%) scale(1) rotate(-1.1deg) translateY(0); }
				50%      { transform: translateX(-50%) scale(1) rotate(1.1deg) translateY(-10px); }
			}

			/* ---------- BOTÓN DE PANTALLA COMPLETA ---------- */
			#pantalla {
				position: fixed;
				right: 18px;
				bottom: 18px;
				z-index: 26;      /* visible en escena, pero por debajo del telón */
				width: 42px;
				height: 42px;
				display: none;    /* solo si el navegador soporta la API */
				align-items: center;
				justify-content: center;
				padding: 0;
				border: 1px solid rgba(232, 194, 90, 0.45);
				border-radius: 6px;
				background: rgba(10, 6, 20, 0.45);
				backdrop-filter: blur(4px);
				color: #e8c25a;
				cursor: pointer;
				opacity: 0.45;
				transition: opacity 0.3s ease, box-shadow 0.3s ease;
			}

			#pantalla.disponible { display: flex; }
			#pantalla:hover { opacity: 1; box-shadow: 0 0 18px rgba(232, 194, 90, 0.4); }

			#pantalla svg { width: 20px; height: 20px; display: block; }
			#pantalla .cerrar { display: none; }
			#pantalla.completa .abrir { display: none; }
			#pantalla.completa .cerrar { display: block; }

			/* ---------- AVISO DE GIRAR EL MÓVIL ---------- */
			#gira {
				position: fixed;
				inset: 0;
				z-index: 60;          /* por encima de todo, telón incluido */
				display: none;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 32px;
				padding: 0 32px;
				background: #07040f;
				color: #efe4ff;
				text-align: center;
			}

			#gira.visible { display: flex; }

			/* el "móvil" es puro CSS, no descarga ninguna imagen */
			#gira .movil {
				position: relative;
				width: 62px;
				height: 104px;
				border: 3px solid #e8c25a;
				border-radius: 12px;
				box-shadow: 0 0 26px rgba(232, 194, 90, 0.35);
				animation: girar 2.6s ease-in-out infinite;
			}

			#gira .movil::after {
				content: '';
				position: absolute;
				left: 50%;
				bottom: 8px;
				transform: translateX(-50%);
				width: 22px;
				height: 3px;
				border-radius: 2px;
				background: #e8c25a;
			}

			@keyframes girar {
				0%, 28%   { transform: rotate(0deg); }
				62%, 100% { transform: rotate(-90deg); }
			}

			#gira p {
				margin: 0;
				font-size: 17px;
				letter-spacing: 0.2em;
				text-transform: uppercase;
				text-shadow: 0 0 18px rgba(190, 160, 255, 0.5);
			}

			#gira small {
				color: #a99cc4;
				font-size: 12px;
				letter-spacing: 0.12em;
				line-height: 1.7;
			}

			/* salida por si el móvil tiene el giro bloqueado */
			#gira-igual {
				margin-top: 6px;
				padding: 10px 18px;
				border: 0;
				background: none;
				color: #7d6f9c;
				font-family: inherit;
				font-size: 12px;
				letter-spacing: 0.14em;
				text-decoration: underline;
				text-underline-offset: 5px;
				cursor: pointer;
				transition: color 0.3s ease;
			}

			#gira-igual:hover { color: #efe4ff; }

			/* ---------- TELÓN DE CIRCO (escena 2 -> escena 1) ---------- */
			#circo {
				position: fixed;
				inset: 0;
				z-index: 40;
				pointer-events: none;
				visibility: hidden;
				overflow: hidden;
			}

			#circo.activo { visibility: visible; }

			.cortina {
				position: absolute;
				top: 0;
				bottom: 0;
				width: 51%;
				/* pliegues de terciopelo: franjas verticales de luz y sombra */
				background:
					repeating-linear-gradient(90deg,
						rgba(0, 0, 0, 0.42) 0 3px,
						rgba(0, 0, 0, 0) 3px 22px,
						rgba(255, 220, 190, 0.10) 22px 30px,
						rgba(0, 0, 0, 0) 30px 52px),
					linear-gradient(90deg, #5e0b12, #a3161f 22%, #7d0f18 48%, #b21b26 72%, #5e0b12);
				box-shadow: inset 0 0 140px rgba(0, 0, 0, 0.75);
				transition: transform 1.6s cubic-bezier(0.65, 0, 0.35, 1);
			}

			.cortina.izq { left: 0;  transform: translateX(-102%); }
			.cortina.der { right: 0; transform: translateX(102%); }

			#circo.cerrado .cortina.izq,
			#circo.cerrado .cortina.der { transform: translateX(0); }

			/* al abrir, más lento y con arranque perezoso, como tela pesada */
			#circo.abriendo .cortina {
				transition: transform 2.4s cubic-bezier(0.5, 0, 0.2, 1);
			}

			/* galería / bambalina superior con festón */
			#galeria {
				position: absolute;
				top: 0;
				left: 0;
				right: 0;
				height: 15vh;
				background: linear-gradient(180deg, #8c1119, #b81d28 55%, #6d0d14);
				border-bottom: 3px solid #e8c25a;
				box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
				transform: translateY(-104%);
				transition: transform 1.6s cubic-bezier(0.65, 0, 0.35, 1);
			}

			#galeria::after {
				content: '';
				position: absolute;
				top: 100%;
				left: 0;
				right: 0;
				height: 5vh;
				background: radial-gradient(circle 4vh at 4vh 0, #a3161f 62%, transparent 63%) repeat-x;
				background-size: 8vh 5vh;
			}

			#circo.cerrado #galeria,
			#circo.abriendo #galeria { transform: translateY(0); }

			/* foco de luz */
			#spotlight {
				position: absolute;
				inset: 0;
				opacity: 0;
				mix-blend-mode: screen;
				transition: opacity 1.1s ease;
				background:
					/* haz que baja desde arriba */
					linear-gradient(180deg, rgba(255, 244, 200, 0.30), rgba(255, 244, 200, 0) 62%),
					/* charco de luz */
					radial-gradient(ellipse 38vmin 30vmin at 50% 46%,
						rgba(255, 246, 205, 0.62),
						rgba(255, 238, 170, 0.20) 46%,
						rgba(255, 230, 150, 0) 72%);
			}

			#spotlight.visible { opacity: 1; }
		</style>
	</head>
	<body>
        <script type="importmap">
            {
              "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@v0.149.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.149.0/examples/jsm/"
              }
            }
          </script>

		<div id="intro"><h1>HOLA, DANI</h1></div>

		<div id="carta-overlay">
			<img src="assets/imagenes/carta.png" alt="Carta">
			<p>Click para cerrar</p>
		</div>

		<canvas id="confeti"></canvas>

		<div id="aviso-sonido">Haz click para activar el sonido</div>

		<canvas id="glitch"></canvas>
		<div id="fundido"></div>

		<button id="entrar" type="button">Entrar</button>
		<button id="soplar" type="button">Soplar vela</button>

		<canvas id="confeti2"></canvas>
		<img id="letrero" src="assets/imagenes/felizcumple_Letrero.png" alt="Feliz cumpleaños">

		<button id="pantalla" type="button" title="Pantalla completa" aria-label="Pantalla completa">
			<svg class="abrir" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
			     stroke-linecap="round" stroke-linejoin="round">
				<path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>
			</svg>
			<svg class="cerrar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
			     stroke-linecap="round" stroke-linejoin="round">
				<path d="M3 8h3a2 2 0 0 0 2-2V3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M21 16h-3a2 2 0 0 0-2 2v3"/>
			</svg>
		</button>

		<div id="gira">
			<div class="movil"></div>
			<p>Voltea tu celular</p>
			<small>Ponlo en horizontal<br>para ver la experiencia completa</small>
			<button id="gira-igual" type="button">Continuar de todos modos</button>
		</div>

		<div id="circo">
			<div class="cortina izq"></div>
			<div class="cortina der"></div>
			<div id="galeria"></div>
			<div id="spotlight"></div>
		</div>

		<script type="module" src="js/main.js"></script>

	</body>
</html>
